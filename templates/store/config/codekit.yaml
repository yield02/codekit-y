# Knowledge store settings for project "{{project}}".
# ONE store per project: shared by every member and by every repo/service of the project
# (e.g. core, product, ...). Edit and commit (git backend) or save (folder backend).
project: {{project}}
defaultBranch: {{defaultBranch}}

# Source files that need a map. Empty include = everything not excluded.
include: []
exclude:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/target/**"
  - "**/bin/**"
  - "**/obj/**"
  - "**/.venv/**"
  - "**/__pycache__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/test/**"
  - "**/tests/**"
  - "*.lock"
  - "package-lock.json"
  - "*.min.js"
  - "*.map"
  - "*.png"
  - "*.jpg"
  - "*.svg"
  - "*.ico"
  - "*.md"
  - ".serena/**"
  - ".ua/**"

# warn: report missing/stale maps | fail: Claude Code's Stop hook asks the AI to write them first
enforce: fail
# true: files the AI only read also need a map; false: only edited files
trackReads: true
# Soft limit for a map body
mapMaxLines: 60

# Detect squash/rebase PR merges through the GitHub API (read-only GET requests).
# Token: GITHUB_TOKEN or GH_TOKEN env var (optional for public repos). apiUrl for GitHub Enterprise.
github:
  enabled: true
  # apiUrl: https://github.example.com/api/v3
  checkIntervalMinutes: 10

# Push guard: AI agents may edit and commit locally in the source repo but NEVER push.
# Artifact guard: AI agents may not create or change AI files in the source repo
# (AGENTS.md, CLAUDE.md, .cursor/, .claude/, docs/plans/, docs/superpowers/, …).
# Neither guard can be turned off.
guard:
  # MCP tools exempt from the push guard (e.g. issue comments)
  allowMcpTools: []
  # Extra AI file patterns for this team (globs, repo-relative)
  artifactPaths: []
  # Real project paths that look like AI files, e.g. a product "docs/plans/**" folder
  allowPaths: []

# Repos (services) of this project. `codekit init` adds each repo the first time it is
# registered, so every developer uses the same names. Optional per-repo overrides:
#   defaultBranch, include, exclude (added to the list above), description (shown to agents).
# repos:
#   core:
#     remote: github.com/abc/abc-core
#     description: Users, auth and shared domain
#   product:
#     remote: github.com/abc/abc-product
#     defaultBranch: develop
#     exclude: ["**/generated/**"]
