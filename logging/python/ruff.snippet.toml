# Merge into pyproject.toml ([tool.ruff] section) or ruff.toml.
[tool.ruff.lint]
extend-select = ["T20", "TID251"]   # T20: no print(); TID251: banned APIs

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.getLogger".msg = "Use get_logger() from the project logging module so every entry has correlationId and tags."
"logging.basicConfig".msg = "Call configure_logging() once at startup instead."

[tool.ruff.lint.per-file-ignores]
"**/logging/**" = ["TID251"]
"**/codekit_logging.py" = ["TID251"]
